<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Galería infinita</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: #fffffc;
    }

    .grid {
      position: fixed;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .grid.is-dragging {
      cursor: grabbing;
    }

    .cell {
      position: absolute;
      top: 0;
      left: 0;
      width: var(--cell-w);
      height: var(--cell-h);
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform;
    }

    .cell img {
      width: 60%;
      aspect-ratio: 3 / 2;
      object-fit: cover;
      background: #e2e2de;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s;
    }

    .cell img.loaded {
      opacity: 1;
    }

    .popup {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: min(380px, calc(100vw - 48px));
      padding: 12px;
      background: #fff;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
      z-index: 10;
      opacity: 0;
      transform: translateY(16px);
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
    }

    .popup.open {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }

    .popup img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 50vh;
      object-fit: contain;
      /* full image, no cropping */
      background: #e2e2de;
    }

    .popup h2 {
      margin: 12px 0 4px;
      font: 600 15px/1.3 system-ui, sans-serif;
    }

    .popup p {
      font: 13px/1.5 system-ui, sans-serif;
      color: #555;
    }
  </style>
</head>

<body>
  <header>
    <nav class="site-nav">
      <a href="index.html#home">Emma Potterill</a>
      <ul>
        <li><a href="index.html#home">Home</a></li>
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#contact">Contact</a></li>
        <li><a href="gallery.html">Gallery</a></li>
      </ul>
    </nav>
  </header>
  <div class="grid" id="grid"></div>
  <aside class="popup" id="popup">
    <img id="popupImg" alt="" />
    <h2 id="popupTitle"></h2>
    <p id="popupText"></p>
  </aside>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Observer.min.js"></script>
  <script>
    gsap.registerPlugin(Observer);

    const COUNT = 2; // how many images you have
    const IMAGES = Array.from({ length: COUNT }, (_, i) => `images/${i + 1}.jpg`);
    // ---------- Ajustes ----------

    const WHEEL_SPEED = 0.75; // sensibilidad de la rueda / trackpad
    const DRAG_SPEED = 1.25; // sensibilidad al arrastrar
    const DRIFT_MIN = 0.35; // velocidad mínima del movimiento automático (px por fotograma)
    const DRIFT_MAX = 0.5; // velocidad máxima tras "lanzar" la galería
    const DRIFT_DECAY = 0.995; // cuánto tarda en frenar (más cerca de 1 = más lento)
    const SMOOTH = 0.1; // suavizado del movimiento (más bajo = más inercia)

    // ---------- Estado ----------
    const grid = document.getElementById("grid");
    const pos = { x: 0, y: 0 }; // posición actual
    const target = { x: 0, y: 0 }; // posición a la que vamos
    const drift = { x: -0.2, y: -0.10 }; // dirección y velocidad iniciales
    let cells = [],
      wrapX,
      wrapY,
      dragging = false;

    // Crea una rejilla un poco más grande que la pantalla (1 fila y 1 columna extra)
    function build() {
      const cellW = innerWidth < 700 ? innerWidth / 2 : innerWidth / 4;
      const cellH = cellW * 0.8;
      const cols = Math.ceil(innerWidth / cellW) + 1;
      const rows = Math.ceil(innerHeight / cellH) + 1;

      // Lo que sale por un lado entra por el otro
      wrapX = gsap.utils.wrap(-cellW, cols * cellW - cellW);
      wrapY = gsap.utils.wrap(-cellH, rows * cellH - cellH);

      grid.style.setProperty("--cell-w", cellW + "px");
      grid.style.setProperty("--cell-h", cellH + "px");
      grid.innerHTML = "";
      cells = [];

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const el = document.createElement("div");
          const img = document.createElement("img");
          el.className = "cell";
          img.alt = "";
          img.draggable = false;
          img.dataset.index = (r * cols + c) % IMAGES.length;
          img.onload = () => img.classList.add("loaded");
          img.src = IMAGES[(r * cols + c) % IMAGES.length];
          el.appendChild(img);
          grid.appendChild(el);
          cells.push({ el, x: c * cellW, y: r * cellH });
        }
      }
      render();
    }

    function render() {
      for (const c of cells) {
        c.el.style.transform = `translate3d(${wrapX(c.x + pos.x)}px, ${wrapY(c.y + pos.y)}px, 0)`;
      }
    }

    // Convierte el último gesto en la nueva deriva (misma dirección, velocidad limitada)
    function setDrift(dx, dy) {
      const speed = Math.hypot(dx, dy);
      if (!speed) return;
      const k = gsap.utils.clamp(DRIFT_MIN, DRIFT_MAX, speed) / speed;
      drift.x = dx * k;
      drift.y = dy * k;
    }

    // Bucle de animación
    gsap.ticker.add(() => {
      const dt = gsap.ticker.deltaRatio(); // 1 = 60 fps

      if (!dragging) {
        target.x += drift.x * dt;
        target.y += drift.y * dt;
        // Frena poco a poco, pero nunca por debajo de la velocidad mínima
        if (Math.hypot(drift.x, drift.y) > DRIFT_MIN) {
          const d = Math.pow(DRIFT_DECAY, dt);
          drift.x *= d;
          drift.y *= d;
        }
      }

      const k = 1 - Math.pow(1 - SMOOTH, dt);
      pos.x += (target.x - pos.x) * k;
      pos.y += (target.y - pos.y) * k;
      render();
    });

    // Rueda, trackpad, arrastre con ratón y táctil
    Observer.create({
      target: grid,
      type: "wheel,touch,pointer",
      wheelSpeed: -1, // la rueda mueve el contenido en sentido natural
      preventDefault: true,
      onPress: () => {
        dragging = true;
        grid.classList.add("is-dragging");
      },
      onRelease: () => {
        dragging = false;
        grid.classList.remove("is-dragging");
      },
      onChange: (self) => {
        const speed = self.event.type === "wheel" ? WHEEL_SPEED : DRAG_SPEED;
        const dx = self.deltaX * speed;
        const dy = self.deltaY * speed;
        target.x += dx;
        target.y += dy;
        setDrift(dx * 0.1, dy * 0.1);
      },
    });

    // Title and text for each image, in the same order as the files (1, 2, 3...)
    const CAPTIONS = [
      { title: "Image 1", text: "Write your text for the first image here." },
      { title: "Image 2", text: "Write your text for the second image here." },
      // ...one entry per image
    ];

    const popup = document.getElementById("popup");
    const popupImg = document.getElementById("popupImg");
    const popupTitle = document.getElementById("popupTitle");
    const popupText = document.getElementById("popupText");

    function openPopup(img) {
      const i = Number(img.dataset.index);
      const cap = CAPTIONS[i] || { title: `Image ${i + 1}`, text: "" };
      popupImg.src = IMAGES[i];
      popupTitle.textContent = cap.title;
      popupText.textContent = cap.text;
      popup.classList.add("open");
    }

    function closePopup() {
      popup.classList.remove("open");
    }

    // Click = pointer released close to where it was pressed (not a drag)
    let downPos = null;
    grid.addEventListener("pointerdown", (e) => {
      downPos = { x: e.clientX, y: e.clientY };
    });
    grid.addEventListener("pointerup", (e) => {
      if (!downPos) return;
      const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
      downPos = null;
      if (moved > 6) return; // it was a drag

      const hit = [...grid.querySelectorAll("img")].find((img) => {
        const r = img.getBoundingClientRect();
        return e.clientX >= r.left && e.clientX <= r.right &&
          e.clientY >= r.top && e.clientY <= r.bottom;
      });
      hit ? openPopup(hit) : closePopup();
    });

    addEventListener("keydown", (e) => {
      if (e.key === "Escape") closePopup();
    });
    let resizeTimer;
    addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(build, 200);
    });

    build();
  </script>
</body>

</html>
